name: Build and test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install frontend assets
        working-directory: src/ClinicaPro.Client
        run: npm install

      - name: Build Tailwind and TypeScript
        working-directory: src/ClinicaPro.Client
        run: npm run build

      - name: Restore
        run: dotnet restore ClinicaPro.sln

      - name: Build
        run: dotnet build ClinicaPro.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ClinicaPro.sln --configuration Release --no-build --verbosity normal
