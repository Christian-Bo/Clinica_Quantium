<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <meta name="theme-color" content="#1c5844" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f8f6f'/%3E%3Cpath d='M7 25c10 0 17-7 19-19C13 6 7 13 7 25Z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M10 22c3.5-3.5 7-7 14-15' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/app.css" />
    <title>Clínica Pro</title>

    <!-- Pantalla de arranque. Va en línea porque se muestra antes de que
         Blazor descargue el runtime: no puede depender de nada más. -->
    <style>
        .cp-splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: linear-gradient(160deg, #1c5844 0%, #16303f 45%, #10161d 100%);
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            color: #fff;
        }

        .cp-splash__marca {
            width: 62px;
            height: 62px;
            border-radius: 18px;
            background: #2f8f6f;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 18px 38px rgba(47, 143, 111, .45);
            animation: cp-splash-respirar 2.4s ease-in-out infinite;
        }

        .cp-splash__nombre {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -.01em;
        }

        .cp-splash__pie {
            font-size: 13px;
            color: rgba(255, 255, 255, .5);
            margin-top: -12px;
        }

        .cp-splash__barra {
            width: 148px;
            height: 3px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .12);
            overflow: hidden;
        }

        .cp-splash__barra span {
            display: block;
            width: 40%;
            height: 100%;
            border-radius: 999px;
            background: #57bd8e;
            animation: cp-splash-avance 1.4s ease-in-out infinite;
        }

        @keyframes cp-splash-respirar {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.06); }
        }

        @keyframes cp-splash-avance {
            0%   { transform: translateX(-110%); }
            100% { transform: translateX(360%); }
        }

        @media (prefers-reduced-motion: reduce) {
            .cp-splash__marca { animation: none; }
            .cp-splash__barra span { animation: none; width: 100%; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="cp-splash">
            <div class="cp-splash__marca">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 20c8 0 14-6 16-16-10 0-16 6-16 16Z" />
                    <path d="M6 18c3-3 6-6 12-13" />
                </svg>
            </div>
            <div class="cp-splash__nombre">Clínica Pro</div>
            <div class="cp-splash__pie">Preparando tu portal…</div>
            <div class="cp-splash__barra"><span></span></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error inesperado.
        <a href="." class="reload">Recargar</a>
    </div>

    <script src="js/interop.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
